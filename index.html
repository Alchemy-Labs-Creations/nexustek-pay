<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Pay your invoice &middot; NexusTek</title>
<link rel="icon" href="nexustek-icon.png">
<style>
  :root {
    --teal: #12b5a0; --teal-dk: #0a8375; --green: #10b981; --green-dk: #047857;
    --ink: #0f2742; --dim: #5b6d78; --line: rgba(15, 39, 66, 0.10);
    --card: rgba(255, 255, 255, 0.86); --card-2: rgba(255, 255, 255, 0.6);
    --bg1: #e6f6f2; --bg2: #e9f1fb; --bg3: #f2f5f8;
    --shadow: 0 18px 50px rgba(15, 39, 66, 0.16);
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8f3ff; --dim: #93a4b8; --line: rgba(255, 255, 255, 0.12);
      --card: rgba(22, 32, 46, 0.82); --card-2: rgba(255, 255, 255, 0.04);
      --bg1: #0b1622; --bg2: #0d1726; --bg3: #0a141e;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 16px/1.5 var(--font); color: var(--ink);
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    background-attachment: fixed;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 16px 40px;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin: 8px 0 22px; }
  .brand img { width: 40px; height: 40px; border-radius: 9px; display: block; }
  .brand .name { font-size: 22px; font-weight: 700; letter-spacing: .2px; }
  .brand .name span { color: var(--teal); }
  main { width: 100%; max-width: 440px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    box-shadow: var(--shadow); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 26px 24px 24px; overflow: hidden;
  }
  .eyebrow { font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  h1 { margin: 4px 0 2px; font-size: 22px; font-weight: 700; letter-spacing: .1px; }
  .sub { color: var(--dim); font-size: 14.5px; margin: 0 0 18px; }
  .amount { font-size: 44px; font-weight: 800; letter-spacing: -.5px; line-height: 1.05; margin: 2px 0 2px; }
  .amount .cur { font-size: 26px; font-weight: 700; vertical-align: 10px; margin-right: 2px; color: var(--dim); }
  .rows { margin: 18px 0 4px; border-top: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .row .k { color: var(--dim); }
  .row .v { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
  .row .v.due.overdue { color: #c53030; }
  .pay {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    margin-top: 22px; width: 100%; padding: 16px 22px;
    font: 600 17px var(--font); color: #fff; text-decoration: none;
    background: linear-gradient(180deg, var(--teal) 0%, var(--teal-dk) 100%);
    border: none; border-radius: 13px; cursor: pointer;
    box-shadow: 0 10px 24px rgba(18, 181, 160, 0.38);
    transition: transform .08s ease, box-shadow .2s ease, filter .2s ease;
  }
  .pay:hover { filter: brightness(1.04); box-shadow: 0 12px 28px rgba(18, 181, 160, 0.46); }
  .pay:active { transform: translateY(1px); }
  .pay svg { width: 18px; height: 18px; }
  .secure { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 14px; color: var(--dim); font-size: 12.5px; }
  .secure svg { width: 14px; height: 14px; flex: none; }
  .note { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); color: var(--dim); font-size: 13px; line-height: 1.5; }
  .note.warn { color: var(--ink); background: rgba(183, 121, 31, 0.10); border-color: rgba(183, 121, 31, 0.35); }
  footer { margin: 22px auto 0; text-align: center; color: var(--dim); font-size: 12.5px; line-height: 1.6; max-width: 440px; }
  footer a { color: var(--teal-dk); }
  @media (prefers-color-scheme: dark) { footer a { color: var(--teal); } }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="brand"><img src="nexustek-icon.png" alt=""><div class="name" id="brandName"><b>NexusTek</b></div></div>

  <main>
    <section class="card" id="payCard" aria-live="polite">
      <!-- filled by script -->
    </section>
    <footer id="foot"></footer>
  </main>

<script>
  // The branded pay page is a static wrapper: NexusTek's billing emails/invoices link here with the invoice details in
  // the URL, and the "Pay" button sends the client to the real Square checkout. No data is stored or sent anywhere by
  // this page - Square handles the payment, and the amount is fixed by the checkout link.
  // Params: biz (business), n (invoice no.), a (amount), c (currency symbol), d (due date text), to (client),
  //         u (the Square pay URL), e (contact email), p (phone). All optional; u is what makes the Pay button appear.
  (function () {
    var q = new URLSearchParams(location.search);
    var g = function (k) { return (q.get(k) || '').trim(); };
    var esc = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };

    var biz = g('biz'), n = g('n'), a = g('a'), cur = g('c') || '$', due = g('d'), to = g('to'),
        url = g('u'), email = g('e'), phone = g('p');

    if (biz) document.getElementById('brandName').innerHTML = esc(biz);
    document.title = (n ? ('Pay ' + n) : 'Pay your invoice') + ' · ' + (biz || 'NexusTek');

    // Only ever send the client to a real Square checkout. A URL that isn't https to a Square payment host is ignored,
    // so this page can never be turned into an open redirect.
    var paysafe = null;
    try {
      var h = new URL(url).hostname.toLowerCase();
      var ok = /(^|\.)square\.link$/.test(h) || /(^|\.)squareup\.com$/.test(h) || /(^|\.)squareupsandbox\.com$/.test(h) || /\.square\.site$/.test(h);
      if (/^https:$/.test(new URL(url).protocol) && ok) paysafe = url;
    } catch (e) { paysafe = null; }

    var card = document.getElementById('payCard');
    var foot = document.getElementById('foot');

    var lockSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
    var arrowSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

    var rows = '';
    var addRow = function (k, v, cls) { if (v) rows += '<div class="row"><span class="k">' + esc(k) + '</span><span class="v ' + (cls || '') + '">' + v + '</span></div>'; };

    if (paysafe) {
      addRow('Invoice', n ? esc(n) : '');
      addRow('Billed to', to ? esc(to) : '');
      var overdue = '';
      if (due) {
        var dd = Date.parse(due);
        if (!isNaN(dd) && dd < Date.now() - 36e5 * 24) overdue = 'overdue';
        addRow('Due', esc(due), 'due ' + overdue);
      }

      card.innerHTML =
        '<div class="eyebrow">Invoice payment</div>' +
        '<h1>' + (n ? esc(n) : 'Your invoice') + '</h1>' +
        '<p class="sub">from ' + esc(biz || 'NexusTek') + '</p>' +
        (a ? '<div class="amount"><span class="cur">' + esc(cur) + '</span>' + esc(a) + '</div>' : '') +
        (rows ? '<div class="rows">' + rows + '</div>' : '') +
        '<a class="pay" href="' + esc(paysafe) + '" rel="noopener">Pay securely ' + arrowSvg + '</a>' +
        '<div class="secure">' + lockSvg + ' Secure card checkout, powered by Square</div>';
    } else {
      // no valid pay link: a friendly landing state
      card.innerHTML =
        '<div class="eyebrow">Invoice payment</div>' +
        '<h1>Pay your ' + esc(biz || 'NexusTek') + ' invoice</h1>' +
        '<p class="sub">Secure online payment.</p>' +
        '<div class="note warn">Open this page from the <b>Pay</b> link in your invoice email or PDF - that link carries your invoice and takes you to the secure checkout. If you reached this page another way, please use the link your technician sent you' +
        (email ? ', or contact them at <a href="mailto:' + esc(email) + '">' + esc(email) + '</a>' : '') + '.</div>';
    }

    var contact = [];
    if (email) contact.push('<a href="mailto:' + esc(email) + '">' + esc(email) + '</a>');
    if (phone) contact.push(esc(phone));
    foot.innerHTML =
      (contact.length ? esc(biz || 'NexusTek') + ' · ' + contact.join(' · ') + '<br>' : '') +
      'Payments are processed securely by Square. ' + esc(biz || 'NexusTek') + ' never sees your card details.';
  })();
</script>
</body>
</html>
